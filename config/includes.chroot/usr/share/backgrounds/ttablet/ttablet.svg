<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2736" height="1824" viewBox="0 0 2736 1824">
  <title>TTablet — Quiet Orbit</title>
  <desc>Minimal original TTablet wallpaper, an ink-blue gradient with restrained sea-glass orbital lines and a small wordmark.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182d36"/>
      <stop offset=".58" stop-color="#11222a"/>
      <stop offset="1" stop-color="#0b151c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".42" r=".69">
      <stop offset="0" stop-color="#3a756f" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#2c565c" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2c565c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ed0bb" stop-opacity=".72"/>
      <stop offset="1" stop-color="#6c9b9c" stop-opacity=".14"/>
    </linearGradient>
  </defs>
  <rect width="2736" height="1824" fill="url(#night)"/>
  <rect width="2736" height="1824" fill="url(#glow)"/>
  <!-- The orbital accent stays mostly offscreen so icons remain legible. -->
  <circle cx="2108" cy="846" r="1066" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <circle cx="2108" cy="846" r="837" fill="none" stroke="#7baaa1" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="2108" cy="846" r="594" fill="none" stroke="#add5be" stroke-opacity=".11" stroke-width="2"/>
  <path d="M -100 1530 C 670 1240, 1300 1215, 2836 250" fill="none" stroke="#88c8ac" stroke-opacity=".13" stroke-width="3"/>
  <circle cx="1143" cy="1261" r="7" fill="#99d4b9" fill-opacity=".58"/>
  <text x="1368" y="1610" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
        font-size="40" font-weight="600" letter-spacing="7" fill="#d8e8e1"
        opacity=".92">TTablet</text>
</svg>
