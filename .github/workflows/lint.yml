name: Check TTablet build scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash scripts
        run: |
          set -e
          for file in scripts/*.sh; do
            bash -n "$file"
          done
      - name: Check Live Build configuration and POSIX hooks
        run: |
          sh -n auto/config
          for file in config/hooks/live/*.hook.chroot; do
            sh -n "$file"
          done
          sh -n config/includes.chroot/usr/local/libexec/ttablet-set-phosh-session
