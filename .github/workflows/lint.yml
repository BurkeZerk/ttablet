name: Check TTablet build scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash scripts
        run: |
          set -e
          for file in scripts/*.sh; do
            bash -n "$file"
          done
      - name: Check Live Build configuration and POSIX hooks
        run: |
          sh -n auto/config
          for file in config/hooks/live/*.hook.chroot; do
            sh -n "$file"
          done
          for file in config/includes.chroot/usr/local/libexec/ttablet-*; do
            sh -n "$file"
          done
      - name: Test required manifest packages and architecture qualifiers
        run: |
          set -e
          positive=$(mktemp)
          negative=$(mktemp)
          trap 'rm -f "$positive" "$negative"' EXIT
          cat > "$positive" <<'MANIFEST'
          linux-image-surface 1.0
          phosh-tablet 1.0
          flatpak:amd64 1.16
          gnome-console 48.0
          gnome-software 48.3
          gnome-software-plugin-deb 48.3
          gnome-software-plugin-fwupd 48.3
          packagekit 1.3
          fwupd 2.0
          xdg-desktop-portal-gtk 1.15
          iptsd 1.0
          wpasupplicant:amd64 2:2.10-24
          wireless-regdb 1.0
          calamares-settings-debian 1.0
          dosfstools 4.2
          squashfs-tools 1:4.6.1-1
          grub-efi 2.12
          grub-efi-amd64 2.12
          grub-efi-amd64-bin:amd64 2.12
          grub2-common 2.12
          efibootmgr 18
          intel-media-va-driver:amd64 25.2.3+dfsg1-1
          vainfo 2.0
          intel-gpu-tools 2.0
          MANIFEST
          bash scripts/check-manifest.sh "$positive"
          for package in flatpak gnome-console gnome-software gnome-software-plugin-deb \
              gnome-software-plugin-fwupd packagekit fwupd xdg-desktop-portal-gtk \
              wpasupplicant wireless-regdb grub-efi grub-efi-amd64 \
              grub-efi-amd64-bin grub2-common efibootmgr intel-media-va-driver \
              dosfstools squashfs-tools; do
            sed "/^$package[:[:space:]]/d" "$positive" > "$negative"
            if bash scripts/check-manifest.sh "$negative"; then
              echo "ERROR: missing $package was not detected" >&2
              exit 1
            fi
          done
          echo "Manifest positive and negative checks passed"
      - name: Validate Firefox media defaults
        run: |
          set -e
          python3 -m json.tool config/includes.chroot/etc/firefox/policies/policies.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("config/includes.chroot/etc/firefox/policies/policies.json").read_text())
          av1 = p["policies"]["Preferences"]["media.av1.enabled"]
          assert av1 == {"Value": False, "Status": "default"}, av1
          print("Verified reversible AV1-disabled Firefox default")
          PY
      - name: Test excluded optional lean packages
        run: |
          set -e
          good=$(mktemp)
          bad=$(mktemp)
          trap 'rm -f "$good" "$bad"' EXIT
          printf 'phosh-tablet 46.1\ngnome-software 48.3\nlibmalcontent-0-0:amd64 0.13\n' > "$good"
          bash scripts/check-lean-manifest.sh "$good"
          for app in malcontent-gui phosh-tour gnome-tour; do
            cp "$good" "$bad"
            printf '%s:amd64 1.0\n' "$app" >> "$bad"
            if bash scripts/check-lean-manifest.sh "$bad"; then
              echo "ERROR: excluded $app escaped manifest check" >&2
              exit 1
            fi
          done
          echo "Exclusion checks passed"

  offline-uefi-packages:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Calamares UEFI APT request works offline
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          installer_list=config/package-lists/30-installer.list.chroot
          boot_packages=$(awk '$1 ~ /^(grub-efi|grub-efi-amd64|efibootmgr)$/ {print $1}' "$installer_list")
          apt-get install -y --no-install-recommends $boot_packages
          apt-get clean
          # Match the helper's APT request with no sources or cached archives.
          apt-get -y --no-download -o Dir::Etc::sourcelist=/dev/null \
            -o Dir::Etc::sourceparts=- install grub-efi
          test -x /usr/sbin/grub-install
          test -x /usr/bin/efibootmgr

  calamares-password-policy:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Test password policy against Debian's packaged users.conf
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends python3-yaml
          hook="$PWD/config/hooks/live/050-calamares-password-policy.hook.chroot"
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          cd "$temp_dir"
          apt-get download calamares-settings-debian
          dpkg-deb -x calamares-settings-debian_*.deb debian-config

          original=debian-config/etc/calamares/modules/users.conf
          cp "$original" users.conf
          sh "$hook" users.conf
          python3 - "$original" <<'PY'
          import sys

          import yaml

          before = yaml.safe_load(Path(sys.argv[1]).read_text())
          after = yaml.safe_load(Path("users.conf").read_text())
          before.update(
              passwordRequirements={"minLength": 4},
              allowWeakPasswords=False,
              allowWeakPasswordsDefault=False,
          )
          assert after == before, after
          assert type(after["passwordRequirements"]["minLength"]) is int
          assert after["allowWeakPasswords"] is False
          assert after["allowWeakPasswordsDefault"] is False
          PY

          cp users.conf expected.conf
          sh "$hook" users.conf
          cmp expected.conf users.conf

          sed '/^allowWeakPasswords\(Default\)\{0,1\}:/s/false/true/' expected.conf > users.conf
          sh "$hook" users.conf
          cmp expected.conf users.conf

          printf 'passwordRequirements: {minLength: 8}\n' > unexpected.conf
          cp unexpected.conf original.conf
          if sh "$hook" unexpected.conf; then
            echo "ERROR: unexpected policy layout passed the build hook" >&2
            exit 1
          fi
          cmp original.conf unexpected.conf

  ttablet-desktop:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Validate TTablet wallpaper defaults and launchers
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends desktop-file-utils libglib2.0-bin gsettings-desktop-schemas python3
          override=config/includes.chroot/usr/share/glib-2.0/schemas/99_ttablet.gschema.override
          wallpaper=config/includes.chroot/usr/share/backgrounds/ttablet/ttablet.svg
          test -s "$override"
          test -s "$wallpaper"
          python3 - "$wallpaper" "$override" <<'PY'
          import configparser
          from xml.etree import ElementTree
          import sys
          ElementTree.parse(sys.argv[1])
          parser = configparser.ConfigParser()
          parser.read(sys.argv[2])
          section = parser["org.gnome.desktop.background"]
          expected = "'file:///usr/share/backgrounds/ttablet/ttablet.svg'"
          assert section["picture-uri"] == expected
          assert section["picture-uri-dark"] == expected
          assert section["picture-options"] == "'zoom'"
          PY
          cp "$override" /usr/share/glib-2.0/schemas/
          glib-compile-schemas --strict /usr/share/glib-2.0/schemas
          desktop-file-validate config/includes.chroot/usr/share/applications/ttablet-*.desktop
          echo "TTablet wallpaper defaults and launchers validated"
